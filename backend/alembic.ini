# Alembic configuration for MySQL database migrations.
# See: https://alembic.sqlalchemy.org/

[alembic]
# Path to migration scripts
script_location = alembic

# Database URL is loaded from environment
sqlalchemy.url = mysql+pymysql://xinhuo:xinhuo-dev-pwd@mysql:3306/xinhuo?charset=utf8mb4

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
