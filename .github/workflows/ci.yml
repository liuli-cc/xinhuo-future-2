name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: xinhuo
          MYSQL_USER: xinhuo
          MYSQL_PASSWORD: test-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply MySQL migrations
        env:
          DATABASE_URL: mysql+pymysql://xinhuo:test-password@127.0.0.1:3306/xinhuo?charset=utf8mb4
        run: alembic upgrade head
      - name: Run backend tests
        env:
          LOCAL_STORAGE_PATH: /tmp/xinhuo-test-storage
        run: pytest -q

  frontend:
    name: Frontend lint, tests and export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install document parser dependencies
        working-directory: functions/xinhuo-api
        run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000

  repository-security:
    name: Repository security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend dependency audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt
      - name: Production dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Cloud function dependency audit
        working-directory: functions/xinhuo-api
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
